<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
    <title>含英牌战区数据工具</title>
    <meta name="description" content="战双帕弥什含英牌战区榜单分析：本周排行、玩家查询、幻痛囚笼、历史战绩与阵容参考。">
    <meta name="theme-color" content="#eceff3">
    <!-- 提前和资源站/接口站建立连接，省掉 DNS + TLS 的往返 -->
    <link rel="preconnect" href="https://assets.huaxu.app">
    <link rel="dns-prefetch" href="https://assets.huaxu.app">
    <link rel="preconnect" href="https://api.huaxu.app" crossorigin>
    <link rel="dns-prefetch" href="https://api.huaxu.app">
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="192x192" href="/img/brand-192.png">
    <link rel="apple-touch-icon" href="/img/brand-180.png">
    <meta property="og:type" content="website">
    <meta property="og:title" content="含英牌战区数据工具">
    <meta property="og:description" content="战双帕弥什含英牌战区榜单分析：本周排行、玩家查询、幻痛囚笼、历史战绩与阵容参考。">
    <meta property="og:image" content="https://jiatenghui.icu/img/brand-256.png">
    <meta name="twitter:card" content="summary">

    <!--
      首屏骨架：写在 HTML 里的纯 CSS 加载页，不依赖 JS/CSS 包。
      作用：从「点进链接」到「React 挂载完成」这段时间不再是一片白。
      背景与主题保持一致（同一套底色 + 同样的顶部色光），淡出时不会跳色。
    -->
    <style>
        html, body {
            margin: 0;
            padding: 0;
            background-color: #eceff3;
        }
        #boot {
            position: fixed;
            inset: 0;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: #eceff3;
            background-image:
                radial-gradient(900px 460px at 6% -12%, rgba(63, 110, 203, 0.1) 0%, rgba(63, 110, 203, 0) 62%),
                radial-gradient(820px 420px at 94% -16%, rgba(176, 122, 18, 0.1) 0%, rgba(176, 122, 18, 0) 62%),
                radial-gradient(1200px 480px at 50% -160px, #ffffff 0%, rgba(255, 255, 255, 0) 70%);
            background-repeat: no-repeat;
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            color: #14171c;
            transition: opacity 260ms cubic-bezier(0.16, 1, 0.3, 1), transform 260ms cubic-bezier(0.16, 1, 0.3, 1);
            will-change: opacity, transform;
        }
        #boot.is-done {
            opacity: 0;
            transform: translateY(-6px);
            pointer-events: none;
        }
        .boot-mark {
            width: 88px;
            height: 88px;
            border-radius: 22px;
            /* 站点图标（含英立绘）：写成背景图，浏览器解析 CSS 时就会开始下载，不用等 JS */
            background: #e6e9ee url(/img/brand-176.webp) center / cover no-repeat;
            border: 1px solid rgba(16, 24, 40, 0.08);
            box-shadow: 0 14px 30px rgba(16, 24, 40, 0.16);
            animation: boot-breathe 2.4s ease-in-out infinite;
        }
        .boot-title {
            margin-top: 22px;
            font-size: 15px;
            font-weight: 600;
            letter-spacing: 0.01em;
        }
        .boot-track {
            position: relative;
            margin-top: 18px;
            width: 168px;
            height: 3px;
            border-radius: 999px;
            background: rgba(20, 23, 28, 0.12);
            overflow: hidden;
        }
        .boot-track i {
            position: absolute;
            top: 0;
            left: 0;
            display: block;
            width: 46%;
            height: 100%;
            border-radius: 999px;
            background: linear-gradient(90deg, rgba(20, 23, 28, 0) 0%, #14171c 42%, #14171c 100%);
            animation: boot-slide 1.3s cubic-bezier(0.45, 0.05, 0.35, 1) infinite;
        }
        .boot-tip {
            margin-top: 14px;
            font-size: 12px;
            color: #8a919d;
            min-height: 18px;
            letter-spacing: 0.01em;
        }
        .boot-dots::after {
            content: '';
            animation: boot-dots 1.4s steps(4, end) infinite;
        }
        @keyframes boot-breathe {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-3px) scale(1.035); }
        }
        /* 只在轨道内来回扫，不会整块滑出视野，避免某一帧看着像「卡住不动」 */
        @keyframes boot-slide {
            0% { transform: translateX(-115%); }
            100% { transform: translateX(150%); }
        }
        @keyframes boot-dots {
            0% { content: ''; }
            25% { content: '·'; }
            50% { content: '··'; }
            75% { content: '···'; }
        }
        @media (max-width: 560px) {
            .boot-mark { width: 72px; height: 72px; border-radius: 18px; }
            .boot-title { margin-top: 18px; }
        }
        @media (prefers-reduced-motion: reduce) {
            .boot-mark { animation: none; }
            .boot-track i { animation: none; width: 100%; opacity: 0.55; }
            .boot-dots::after { animation: none; content: '···'; }
        }
    </style>
</head>
<body>
    <div id="boot" role="status" aria-live="polite" aria-label="正在加载">
        <div class="boot-mark" role="img" aria-label="含英牌"></div>
        <div class="boot-title">含英牌战区数据工具</div>
        <div class="boot-track"><i></i></div>
        <div class="boot-tip boot-dots" id="boot-tip">正在连接数据源</div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <!-- 加载时间较长时给一句说明，避免用户以为卡死；React 挂载后这个计时器会被清掉 -->
    <script>
        (function () {
            var tip = document.getElementById('boot-tip');
            window.__bootTimers = [
                setTimeout(function () { if (tip) tip.textContent = '数据源响应较慢，正在重试'; }, 6000),
                setTimeout(function () { if (tip) tip.textContent = '网络似乎不太顺畅，可稍候或刷新'; }, 15000)
            ];
            // JS 迟迟没跑起来（例如体积大的包下载失败）时，至少告诉用户不是在白等
            setTimeout(function () {
                var root = document.getElementById('root');
                if (root && !root.childElementCount && tip) tip.textContent = '正在下载页面资源，请稍候';
            }, 3000);
        })();
    </script>
</body>
</html>
